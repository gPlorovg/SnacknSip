services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: snacknsip
      POSTGRES_USER: snacknsip
      POSTGRES_PASSWORD: snacknsip
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  minio_init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/menu-images;
      mc anonymous set public local/menu-images;
      exit 0;
      "

volumes:
  postgres_data:
  minio_data:
