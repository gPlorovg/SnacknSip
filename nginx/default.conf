upstream django {
    server web:8000;
}

upstream ui {
    server ui:3000;
}

# Connection upgrade helper for websocket/SSE-safe proxying.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Temporary richer logs to identify whether 404 comes from nginx or upstream.
log_format upstream_timing '$remote_addr - $host "$request" '
                           'status=$status upstream_status=$upstream_status '
                           'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';

# Resolve Docker service names at runtime to avoid stale upstream IPs.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name snacknsip.ru www.snacknsip.ru _;

    set $django_upstream http://web:8000;
    set $ui_upstream http://ui:3000;

    access_log /var/log/nginx/access.log upstream_timing;
    error_log /var/log/nginx/error.log warn;

    # Django staticfiles (collectstatic volume)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # API and Django admin stay on backend service.
    location ^~ /api/ {
        proxy_pass $django_upstream;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
        client_max_body_size 20M;
        add_header X-Proxy-Upstream django always;
    }

    location ^~ /admin/ {
        proxy_pass $django_upstream;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
        client_max_body_size 20M;
        add_header X-Proxy-Upstream django always;
    }

    # Explicit frontend routes that were returning 404.
    location = / {
        proxy_pass $ui_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
        add_header X-Proxy-Upstream ui always;
    }

    # Normalize trailing slash for Next route.
    location = /event/ {
        return 308 /event;
    }

    # Next.js assets
    location /_next/ {
        proxy_pass $ui_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
        add_header X-Proxy-Upstream ui always;
    }

    # Frontend app routes fallback.
    location / {
        proxy_pass $ui_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
        add_header X-Proxy-Upstream ui always;
    }
}
