[project]
name = "snacknsip"
version = "0.1.0"
description = "Service to order snacks and drinks for events"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.ruff]
line-length = 88
target-version = "py312"

[toll.ruff.lint]
# E, W — Flake8 (ошибки и предупреждения)
# F — Pyflakes
# I — Isort (сортировка импортов)
# B — Flake8-bugbear (поиск вероятных багов)
# C4 — Flake8-comprehensions
select = ["E", "W", "F", "I", "B", "C4"]
ignore = []

[toll.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.8",
]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-ra -q --tb=short"

python_files = "tests.py"
python_classes = "Test*"
python_functions = "test_*"
