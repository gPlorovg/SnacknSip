[project]
name = "snacknsip"
version = "0.1.0"
description = "Service to order snacks and drinks for events"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "drf-spectacular>=0.27",
    "django-storages[s3]>=1.14",
    "celery>=5.3",
    "redis>=5.0",
    "psycopg[binary]>=3.1",
    "python-decouple>=3.8",
    "qrcode[pil]>=7.4",
    "Pillow>=10.0",
    "cryptography>=42.0",
    "gunicorn>=22.0",
    "django-cors-headers>=4.9.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[toll.ruff.lint]
# E, W — Flake8 (ошибки и предупреждения)
# F — Pyflakes
# I — Isort (сортировка импортов)
# B — Flake8-bugbear (поиск вероятных багов)
# C4 — Flake8-comprehensions
select = ["E", "W", "F", "I", "B", "C4"]
ignore = []

[toll.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --tb=short"
testpaths = ["src"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
DJANGO_SETTINGS_MODULE = "config.settings.local"
